name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Unit tests (SwiftPM)
        run: swift test

      - name: Build app (Xcode, Release)
        run: |
          xcodebuild -project PRMonitor.xcodeproj -scheme PRMonitor -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
